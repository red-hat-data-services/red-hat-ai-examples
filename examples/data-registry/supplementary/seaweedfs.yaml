# Apply in a dedicated namespace after creating Secret/seaweedfs-credentials.
# The Secret must contain AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and
# WEED_ADMIN_PASSWORD. See s3-compatible-storage.md for the complete workflow.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: docker.io/chrislusf/seaweedfs:4.52
          imagePullPolicy: IfNotPresent
          args:
            - mini
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -admin.port=12646
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: WEED_ADMIN_USER
              value: admin
            - name: WEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-credentials
                  key: WEED_ADMIN_PASSWORD
            - name: S3_BUCKET
              value: data-registry-example
            - name: HOME
              value: /tmp
          ports:
            - name: s3
              containerPort: 8333
            - name: admin
              containerPort: 12646
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
    - name: admin
      port: 12646
      targetPort: admin
