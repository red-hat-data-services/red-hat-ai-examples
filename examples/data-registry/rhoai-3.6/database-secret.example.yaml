# Replace every CHANGE_ME value before applying this example. Do not commit
# production credentials to source control.
apiVersion: v1
kind: Secret
metadata:
  name: data-registry-database
  namespace: rhoai-data-registry
type: Opaque
stringData:
  POSTGRES_HOST: CHANGE_ME
  POSTGRES_PORT: "5432"
  POSTGRES_DB: CHANGE_ME
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME # pragma: allowlist secret
  dsn: |
    path: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    cache_ttl_seconds: 60
