# HardwareProfile read for the pipeline runner (train-only / online / offline).
#
# The serving stage reads a GPU HardwareProfile from redhat-ods-applications.
# Without this grant, InferenceService creation fails after training has
# already completed. Not needed for data-extraction.
#
# Applied in the redhat-ods-applications namespace.
#
# Replace before applying:
#   <project-namespace>  the OpenShift project the pipelines run in
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: speculator-hardwareprofile-reader-<project-namespace>
  namespace: redhat-ods-applications
rules:
  - apiGroups: ["infrastructure.opendatahub.io"]
    resources: ["hardwareprofiles"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: speculator-hardwareprofile-reader-<project-namespace>
  namespace: redhat-ods-applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: speculator-hardwareprofile-reader-<project-namespace>
subjects:
  - kind: ServiceAccount
    namespace: <project-namespace>
    name: pipeline-runner
