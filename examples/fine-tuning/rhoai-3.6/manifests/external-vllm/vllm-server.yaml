# External vLLM server for hidden state extraction.
#
# Used by:
#   - OFFLINE mode (offline/speculator-offline-example.ipynb)
#   - DATA_ONLY mode, Method 2 — external vLLM endpoint (data-only/speculator-data-only-example.ipynb)
#
# Prerequisites:
#   - A PVC named `shared` in the target namespace, with the verifier model
#     pre-downloaded to `models/Qwen3-0.6B` on that PVC (see the model download
#     cell in the notebooks). The PVC is mounted at /mnt in the vLLM pod.
#   - A GPU node with at least 1 available NVIDIA GPU.
#   - Access to the registry.redhat.io/rhaii-fast/vllm-cuda-rhel9 image below
#     (it carries the `extract_hidden_states` speculative config and
#     ExampleHiddenStatesConnector used for extraction, and matches the image
#     used by the vLLM ClusterTrainingRuntimes). It is pinned by digest for
#     reproducibility. On most OpenShift clusters the global pull secret covers
#     registry.redhat.io; if your namespace needs its own credentials, add an
#     `imagePullSecrets` entry pointing at a secret with Red Hat registry
#     credentials.
#
# IMPORTANT: SPECULATOR_HS_PATH below must match the `hidden_states_path`
# passed to SpeculativeDecodingTrainer in the notebook you are running
# (the PVC `shared` root maps to /mnt in this pod):
#   - OFFLINE notebook default:      pvc://shared/speculator/run-01-offline/hidden_states
#     -> /mnt/speculator/run-01-offline/hidden_states   (default below)
#   - DATA_ONLY Method 2 default:    pvc://shared/speculator/run-01/hidden_states
#     -> /mnt/speculator/run-01/hidden_states
# If you change RUN_NAME in the notebook, update this path accordingly.
#
# Deploy with:
#   oc apply -f ../../manifests/external-vllm/vllm-server.yaml -n <your-namespace>
#
# The Service is named `vllm-svc` on port 8000, so the trainer's vllm_endpoint
# is: http://vllm-svc.<your-namespace>.svc.cluster.local:8000/v1
#
# A NetworkPolicy restricts ingress to the vLLM pods: only pods in the same
# namespace, only on TCP port 8000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-svc
spec:
  replicas: 1
  # The pod requests a full GPU, so a default RollingUpdate would need a second
  # GPU to surge the new pod before stopping the old one — on a single-GPU
  # setup the rollout would hang. Recreate stops the old pod first; updates
  # (e.g. oc set env) then proceed with only one GPU available.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-svc
  template:
    metadata:
      labels:
        app: vllm-svc
    spec:
      containers:
      - name: vllm
        image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9@sha256:97c7d6f66f3f0897b3ff10ddd135de930d45bdd116cf41a43e3ad7270029116a
        command: ["sh", "-c"]
        args:
        - |
          TP=${SPECULATOR_VLLM_GPU_COUNT:-1}
          TF=""
          [ "$TP" -gt 1 ] && TF="--tensor-parallel-size $TP"
          python3 -m vllm.entrypoints.cli.main serve \
            "$SPECULATOR_VERIFIER_MODEL" \
            --speculative-config '{"method":"extract_hidden_states",
              "num_speculative_tokens":1,
              "draft_model_config":{"hf_config":{
                "eagle_aux_hidden_state_layer_ids":['"$SPECULATOR_TARGET_LAYER_IDS"']}}}' \
            --kv-transfer-config '{"kv_connector":"ExampleHiddenStatesConnector",
              "kv_role":"kv_producer",
              "kv_connector_extra_config":{
                "shared_storage_path":"'"$SPECULATOR_HS_PATH"'"}}' \
            --port 8000 \
            --gpu-memory-utilization ${SPECULATOR_GPU_MEM_UTIL:-0.9} \
            --no-enable-chunked-prefill \
            --trust-remote-code $TF
        env:
        - name: SPECULATOR_VERIFIER_MODEL
          value: /mnt/models/Qwen3-0.6B
        # Must match the notebook's hidden_states_path (see header comment).
        - name: SPECULATOR_HS_PATH
          value: /mnt/speculator/run-01-offline/hidden_states
        - name: SPECULATOR_GPU_MEM_UTIL
          value: "0.9"
        # Number of GPUs — the example defaults to 1 (enough for Qwen3-0.6B).
        # Increase for a larger verifier model, and raise the nvidia.com/gpu
        # request/limit below to match — values > 1 add --tensor-parallel-size.
        - name: SPECULATOR_VLLM_GPU_COUNT
          value: "1"
        # Must match TARGET_LAYER_IDS in the notebook (EAGLE3 on Qwen3-0.6B).
        - name: SPECULATOR_TARGET_LAYER_IDS
          value: "2, 14, 25, 28"
        - name: HF_TOKEN
          value: ""
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: HF_HOME
          value: /tmp/hf_cache
        ports:
        - containerPort: 8000
        resources:
          # Single GPU by default — raise together with SPECULATOR_VLLM_GPU_COUNT
          # when scaling up for a larger verifier model.
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          # "shared" matches PVC_NAME in the notebooks and the workbench's
          # shared storage. PVC names are not fixed — if yours differs, change
          # claimName (and PVC_NAME in the notebooks) to match.
          claimName: shared
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
spec:
  selector:
    app: vllm-svc
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-svc-allow-same-namespace
spec:
  # Targets the same pods as the vllm-svc Service selector.
  podSelector:
    matchLabels:
      app: vllm-svc
  policyTypes:
  - Ingress
  ingress:
  # Empty podSelector selects all pods in this namespace — the TrainJob
  # extraction pods and the workbench both run here. Traffic from other
  # namespaces is denied.
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8000
